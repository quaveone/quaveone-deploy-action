name: Release Deploy Action

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Deploy-action version to publish, for example v1.0.45 or 1.0.45"
        required: true
        type: string
      promotion_confirmation:
        description: "Required. Enter tested-action-vX.Y.Z only after the fixed-ref and published-main action smoke tests passed."
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Tag current action and mark release latest
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ inputs.version }}
          PROMOTION_CONFIRMATION: ${{ inputs.promotion_confirmation }}
        run: |
          set -euo pipefail

          VERSION="$INPUT_VERSION"
          case "$VERSION" in
            v*) TAG="$VERSION"; VERSION_NUMBER="${VERSION#v}" ;;
            *) VERSION_NUMBER="$VERSION"; TAG="v${VERSION}" ;;
          esac

          if [[ ! "$VERSION_NUMBER" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Version must look like vX.Y.Z or X.Y.Z; got $INPUT_VERSION."
            exit 1
          fi

          EXPECTED_CONFIRMATION="tested-action-${TAG}"
          if [[ "$PROMOTION_CONFIRMATION" != "$EXPECTED_CONFIRMATION" ]]; then
            echo "::error::This workflow moves the deploy-action Latest release. Test the fixed-ref and published-main action smoke first, then set promotion_confirmation=${EXPECTED_CONFIRMATION}."
            exit 1
          fi

          ACTION_IMAGE="$(ruby -ryaml -e 'puts YAML.load_file("action.yml").dig("runs", "image")')"
          if [[ "$ACTION_IMAGE" != "docker://quaveone/quaveone-cli:latest" ]]; then
            echo "::error::Deploy action runs.image must be docker://quaveone/quaveone-cli:latest. CLI versions are promoted in quaveone-client-utils; got ${ACTION_IMAGE}."
            exit 1
          fi

          git fetch origin main --tags
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::Release deploy-action tags only from main after the published-main smoke passes; current ref is ${GITHUB_REF}."
            exit 1
          fi

          HEAD_SHA="$(git rev-parse HEAD)"
          MAIN_SHA="$(git rev-parse origin/main)"
          if [[ "$HEAD_SHA" != "$MAIN_SHA" ]]; then
            echo "::error::Checked out SHA ${HEAD_SHA} does not match origin/main ${MAIN_SHA}. Dispatch this workflow from the current main commit after smoke passes."
            exit 1
          fi

          if git rev-parse "$TAG" >/dev/null 2>&1; then
            EXISTING_SHA="$(git rev-list -n 1 "$TAG")"
            if [[ "$EXISTING_SHA" != "$HEAD_SHA" ]]; then
              echo "::error::Tag $TAG already exists at $EXISTING_SHA, expected $HEAD_SHA. Not moving release tags automatically."
              exit 1
            fi
          else
            git tag "$TAG" "$HEAD_SHA"
            git push origin "$TAG"
          fi

          cat > /tmp/deploy-action-release-notes.md <<EOF_NOTES
          Quave ONE deploy action ${TAG}.

          This action uses docker://quaveone/quaveone-cli:latest. CLI runtime versions are promoted by the Quave ONE CLI release workflow after fixed-version smoke tests pass.
          EOF_NOTES

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --latest
          else
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$HEAD_SHA" \
              --title "$TAG" \
              --notes-file /tmp/deploy-action-release-notes.md \
              --latest
          fi
